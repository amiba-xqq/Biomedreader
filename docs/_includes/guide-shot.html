{% assign shot = site.data.guide_shots[include.id] %}
{% assign folder = shot.folder | default: 'guide-222' %}
{% assign shot_url = '/assets/' | append: folder | append: '/' | append: include.id | append: '.webp' | relative_url %}
<figure class="guide-figure">
  <a class="zoom-image" href="{{ shot_url }}" data-guide-zoom aria-label="放大截图：{{ shot.alt | escape }}" aria-describedby="caption-{{ include.id }}">
    <img src="{{ shot_url }}" alt="{{ shot.alt | escape }}" width="{{ shot.width }}" height="{{ shot.height }}" loading="lazy" decoding="async">
    <span aria-hidden="true">放大截图 ↗</span>
  </a>
  <figcaption id="caption-{{ include.id }}">{{ shot.caption | escape }}</figcaption>
</figure>
